<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A1 Wortschatz 50 Karten</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef8fc;font-family:Arial,Tahoma,sans-serif;color:#183c55}main{max-width:1000px;margin:auto;padding:18px}.p{background:#fff;border-radius:20px;padding:21px;margin:14px 0;box-shadow:0 6px 22px #0001}h1{margin:0}button,select{border:0;border-radius:11px;padding:12px 16px;margin:4px;font-size:16px;font-weight:700;cursor:pointer}.blue{background:#287ac5;color:#fff}.green{background:#3e8a63;color:#fff}.soft{background:#e8edf0}.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}.pic{height:150px;border-radius:15px;background:linear-gradient(120deg,#d4edfa,#ffe4bd);display:grid;place-items:center}.pic svg{width:170px;height:120px}.q{font-size:clamp(27px,4vw,38px);font-weight:800}.th{background:#fff0d9;padding:12px;border-radius:11px;font-size:19px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opts button{margin:0;background:#eaf3fa;border:2px solid #cddfea}.opts button.sel{background:#d9efdf;border-color:#3e8a63}.voc{display:flex;gap:8px;flex-wrap:wrap}.voc span{background:#e8f5ec;padding:8px 11px;border-radius:16px}.ans{display:none;background:#e8f5ec;border-left:5px solid #3e8a63;padding:14px;border-radius:11px;line-height:1.7}.ans.on{display:block}.clock{font-size:46px;font-weight:bold;text-align:center}.water{text-align:right;font-weight:bold}@media(max-width:720px){.grid{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}</style></head><body><main>
<div class="p"><h1>🇩🇪 A1 Wortschatz & Satztraining</h1><p>Goethe / telc Allgemein · 50 Karten · Aussage · Verneinung · Perfekt · Frage · Imperativ</p><select id="dur"><option value="30">30 Sekunden</option><option value="60">1 Minute</option></select><button class="blue" id="next">🎲 Karte ziehen</button><button class="soft" id="shuffle">🔀 Neu mischen</button> <b id="count"></b></div>
<div class="grid"><section class="p"><b id="tag"></b><div class="pic"><svg viewBox="0 0 170 120"><rect x="22" y="9" width="126" height="102" rx="13" fill="white" stroke="#5e99bc" stroke-width="3"/><circle cx="58" cy="44" r="15" fill="#f3c38d"/><path d="M41 91c4-25 30-25 35 0" fill="#76b696"/><path d="M92 35h39M92 51h30M92 67h39M92 83h25" stroke="#dfa964" stroke-width="6" stroke-linecap="round"/></svg></div><p><b>Was passt? · เลือกคำที่ถูกต้อง</b></p><div class="q" id="q"></div><p class="th" id="th"></p><div class="opts" id="opts"></div><p><b>Hilfewortschatz · คำศัพท์ตัวช่วย</b></p><div class="voc" id="voc"></div><button class="green" id="reveal">💡 เฉลย เปิด / ปิด</button><div class="ans" id="ans"></div></section>
<aside><div class="p"><h3>⏱️ Zeit</h3><div class="clock" id="clock">00:30</div><button class="green" id="start">▶ Start / Pause</button><button class="soft" id="reset">↻ Reset</button></div><div class="p"><h3>🗣️ Spontan</h3><p>อ่านโจทย์ → เลือก a/b → พูดประโยคเต็ม → แต่งประโยคใหม่</p><button class="blue" id="voice">🔊 ฟังเฉลย</button><button class="soft" id="stop">⏹ Stop</button></div></aside></div><div class="water">Deutsch mit Monmanat</div></main>
<script>const cards=[{"id": 1, "typ": "Aussage", "q": "Ich ___ eine Wohnung.", "a": "suche", "b": "kaufe", "th": "ฉันกำลังมองหาที่พัก", "v": ["suchen = มองหา", "die Wohnung = ที่พัก"], "ans": "Ich suche eine Wohnung."}, {"id": 2, "typ": "Aussage", "q": "Ich mache gern ___.", "a": "Yoga", "b": "Yoka", "th": "ฉันชอบเล่นโยคะ", "v": ["Yoga machen = เล่นโยคะ", "gern = ชอบ"], "ans": "Ich mache gern Yoga."}, {"id": 3, "typ": "Aussage", "q": "Meine Schwester ___ in Berlin.", "a": "wohnt", "b": "wohnen", "th": "พี่สาว/น้องสาวของฉันอาศัยอยู่ที่เบอร์ลิน", "v": ["wohnen = อาศัยอยู่", "die Schwester = พี่สาว/น้องสาว"], "ans": "Meine Schwester wohnt in Berlin."}, {"id": 4, "typ": "Aussage", "q": "Wir ___ jeden Morgen Kaffee.", "a": "trinken", "b": "essen", "th": "พวกเราดื่มกาแฟทุกเช้า", "v": ["trinken = ดื่ม", "jeden Morgen = ทุกเช้า"], "ans": "Wir trinken jeden Morgen Kaffee."}, {"id": 5, "typ": "Aussage", "q": "Der Bus ___ um acht Uhr.", "a": "fährt", "b": "fahrt", "th": "รถบัสออกเวลาแปดโมง", "v": ["fahren = เดินทาง", "um acht Uhr = เวลา 8 โมง"], "ans": "Der Bus fährt um acht Uhr."}, {"id": 6, "typ": "Aussage", "q": "Ich ___ heute meine Freundin.", "a": "besuche", "b": "besuchen", "th": "วันนี้ฉันไปเยี่ยมเพื่อน", "v": ["besuchen = ไปเยี่ยม", "die Freundin = เพื่อนผู้หญิง"], "ans": "Ich besuche heute meine Freundin."}, {"id": 7, "typ": "Aussage", "q": "Mein Vater ___ gern Zeitung.", "a": "liest", "b": "lest", "th": "พ่อของฉันชอบอ่านหนังสือพิมพ์", "v": ["lesen = อ่าน", "die Zeitung = หนังสือพิมพ์"], "ans": "Mein Vater liest gern Zeitung."}, {"id": 8, "typ": "Aussage", "q": "Am Samstag ___ wir im Supermarkt ein.", "a": "kaufen", "b": "kauft", "th": "วันเสาร์พวกเราไปซื้อของ", "v": ["einkaufen = ซื้อของ", "der Supermarkt = ซูเปอร์มาร์เก็ต"], "ans": "Am Samstag kaufen wir im Supermarkt ein."}, {"id": 9, "typ": "Aussage", "q": "Das Kind ___ im Garten.", "a": "spielt", "b": "spielen", "th": "เด็กเล่นในสวน", "v": ["spielen = เล่น", "der Garten = สวน"], "ans": "Das Kind spielt im Garten."}, {"id": 10, "typ": "Aussage", "q": "Ich ___ um sieben Uhr auf.", "a": "stehe", "b": "stelle", "th": "ฉันตื่นนอนเวลาเจ็ดโมง", "v": ["aufstehen = ตื่นนอน", "um sieben Uhr = 7 โมง"], "ans": "Ich stehe um sieben Uhr auf."}, {"id": 11, "typ": "Verneinung", "q": "Ich habe heute ___ Zeit.", "a": "keine", "b": "nicht", "th": "วันนี้ฉันไม่มีเวลา", "v": ["keine Zeit = ไม่มีเวลา", "heute = วันนี้"], "ans": "Ich habe heute keine Zeit."}, {"id": 12, "typ": "Verneinung", "q": "Er trinkt ___ Kaffee.", "a": "keinen", "b": "kein", "th": "เขาไม่ดื่มกาแฟ", "v": ["der Kaffee = กาแฟ", "keinen = ไม่/ไม่มี"], "ans": "Er trinkt keinen Kaffee."}, {"id": 13, "typ": "Verneinung", "q": "Wir fahren heute ___ nach München.", "a": "nicht", "b": "kein", "th": "วันนี้พวกเราไม่ได้ไปมิวนิก", "v": ["nicht = ไม่", "fahren = เดินทาง"], "ans": "Wir fahren heute nicht nach München."}, {"id": 14, "typ": "Verneinung", "q": "Sie hat ___ Auto.", "a": "kein", "b": "nicht", "th": "เธอไม่มีรถยนต์", "v": ["das Auto = รถยนต์", "kein = ไม่มี"], "ans": "Sie hat kein Auto."}, {"id": 15, "typ": "Verneinung", "q": "Das Geschäft ist heute ___ geöffnet.", "a": "nicht", "b": "kein", "th": "วันนี้ร้านไม่ได้เปิด", "v": ["geöffnet = เปิด", "das Geschäft = ร้านค้า"], "ans": "Das Geschäft ist heute nicht geöffnet."}, {"id": 16, "typ": "Verneinung", "q": "Ich esse ___ Fleisch.", "a": "kein", "b": "keine", "th": "ฉันไม่กินเนื้อสัตว์", "v": ["das Fleisch = เนื้อสัตว์", "essen = กิน"], "ans": "Ich esse kein Fleisch."}, {"id": 17, "typ": "Verneinung", "q": "Meine Kinder sehen abends ___ fern.", "a": "nicht", "b": "kein", "th": "ตอนเย็นลูก ๆ ของฉันไม่ดูทีวี", "v": ["fernsehen = ดูทีวี", "abends = ตอนเย็น"], "ans": "Meine Kinder sehen abends nicht fern."}, {"id": 18, "typ": "Verneinung", "q": "Wir haben ___ Haustiere.", "a": "keine", "b": "keinen", "th": "พวกเราไม่มีสัตว์เลี้ยง", "v": ["das Haustier = สัตว์เลี้ยง", "keine = ไม่มี"], "ans": "Wir haben keine Haustiere."}, {"id": 19, "typ": "Verneinung", "q": "Der Termin ist ___ am Montag.", "a": "nicht", "b": "kein", "th": "นัดไม่ได้อยู่วันจันทร์", "v": ["der Termin = นัดหมาย", "am Montag = วันจันทร์"], "ans": "Der Termin ist nicht am Montag."}, {"id": 20, "typ": "Verneinung", "q": "Ich kann heute ___ kommen.", "a": "nicht", "b": "kein", "th": "วันนี้ฉันมาไม่ได้", "v": ["können = สามารถ", "kommen = มา"], "ans": "Ich kann heute nicht kommen."}, {"id": 21, "typ": "Perfekt", "q": "Ich ___ gestern Pizza gemacht.", "a": "habe", "b": "bin", "th": "เมื่อวานฉันทำพิซซ่า", "v": ["gestern = เมื่อวาน", "machen = ทำ"], "ans": "Ich habe gestern Pizza gemacht."}, {"id": 22, "typ": "Perfekt", "q": "Wir ___ nach Berlin gefahren.", "a": "sind", "b": "haben", "th": "พวกเราเดินทางไปเบอร์ลินแล้ว", "v": ["fahren = เดินทาง", "nach Berlin = ไปเบอร์ลิน"], "ans": "Wir sind nach Berlin gefahren."}, {"id": 23, "typ": "Perfekt", "q": "Sie ___ ein Buch gekauft.", "a": "hat", "b": "ist", "th": "เธอซื้อหนังสือแล้ว", "v": ["kaufen = ซื้อ", "das Buch = หนังสือ"], "ans": "Sie hat ein Buch gekauft."}, {"id": 24, "typ": "Perfekt", "q": "Er ___ um sechs Uhr aufgestanden.", "a": "ist", "b": "hat", "th": "เขาตื่นนอนตอนหกโมง", "v": ["aufstehen = ตื่นนอน", "um sechs Uhr = 6 โมง"], "ans": "Er ist um sechs Uhr aufgestanden."}, {"id": 25, "typ": "Perfekt", "q": "Ich ___ meine Mutter angerufen.", "a": "habe", "b": "bin", "th": "ฉันโทรหาแม่แล้ว", "v": ["anrufen = โทรหา", "die Mutter = แม่"], "ans": "Ich habe meine Mutter angerufen."}, {"id": 26, "typ": "Perfekt", "q": "Wir ___ lange gewartet.", "a": "haben", "b": "sind", "th": "พวกเรารอนานแล้ว", "v": ["warten = รอ", "lange = นาน"], "ans": "Wir haben lange gewartet."}, {"id": 27, "typ": "Perfekt", "q": "Meine Freundin ___ nach Hause gegangen.", "a": "ist", "b": "hat", "th": "เพื่อนของฉันกลับบ้านแล้ว", "v": ["nach Hause = กลับบ้าน", "gehen = ไป"], "ans": "Meine Freundin ist nach Hause gegangen."}, {"id": 28, "typ": "Perfekt", "q": "Die Kinder ___ im Park gespielt.", "a": "haben", "b": "sind", "th": "เด็ก ๆ เล่นในสวนแล้ว", "v": ["der Park = สวนสาธารณะ", "spielen = เล่น"], "ans": "Die Kinder haben im Park gespielt."}, {"id": 29, "typ": "Perfekt", "q": "Ich ___ gut geschlafen.", "a": "habe", "b": "bin", "th": "ฉันนอนหลับดี", "v": ["schlafen = นอน", "gut = ดี"], "ans": "Ich habe gut geschlafen."}, {"id": 30, "typ": "Perfekt", "q": "Wann ___ du nach Deutschland gekommen?", "a": "bist", "b": "hast", "th": "คุณมาเยอรมนีเมื่อไหร่", "v": ["wann = เมื่อไหร่", "kommen = มา"], "ans": "Wann bist du nach Deutschland gekommen?"}, {"id": 31, "typ": "Frage", "q": "Wo ___ du?", "a": "wohnst", "b": "wohnt", "th": "คุณอาศัยอยู่ที่ไหน", "v": ["wo = ที่ไหน", "wohnen = อาศัยอยู่"], "ans": "Wo wohnst du?"}, {"id": 32, "typ": "Frage", "q": "___ kostet das Ticket?", "a": "Wie viel", "b": "Wie viele", "th": "ตั๋วราคาเท่าไหร่", "v": ["wie viel = เท่าไหร่", "das Ticket = ตั๋ว"], "ans": "Wie viel kostet das Ticket?"}, {"id": 33, "typ": "Frage", "q": "Wann ___ der Deutschkurs an?", "a": "fängt", "b": "fangen", "th": "คอร์สภาษาเยอรมันเริ่มเมื่อไหร่", "v": ["anfangen = เริ่ม", "der Deutschkurs = คอร์สภาษาเยอรมัน"], "ans": "Wann fängt der Deutschkurs an?"}, {"id": 34, "typ": "Frage", "q": "___ Sie mir bitte helfen?", "a": "Können", "b": "Müssen", "th": "คุณช่วยฉันได้ไหม", "v": ["helfen = ช่วย", "bitte = กรุณา"], "ans": "Können Sie mir bitte helfen?"}, {"id": 35, "typ": "Frage", "q": "Was ___ du am Wochenende?", "a": "machst", "b": "macht", "th": "คุณทำอะไรช่วงสุดสัปดาห์", "v": ["das Wochenende = วันหยุดสุดสัปดาห์", "machen = ทำ"], "ans": "Was machst du am Wochenende?"}, {"id": 36, "typ": "Frage", "q": "Wie oft ___ du Sport?", "a": "machst", "b": "macht", "th": "คุณออกกำลังกายบ่อยแค่ไหน", "v": ["wie oft = บ่อยแค่ไหน", "Sport machen = ออกกำลังกาย"], "ans": "Wie oft machst du Sport?"}, {"id": 37, "typ": "Frage", "q": "Warum ___ du Deutsch?", "a": "lernst", "b": "lernen", "th": "ทำไมคุณเรียนภาษาเยอรมัน", "v": ["warum = ทำไม", "Deutsch lernen = เรียนเยอรมัน"], "ans": "Warum lernst du Deutsch?"}, {"id": 38, "typ": "Frage", "q": "Mit wem ___ du in den Urlaub?", "a": "fährst", "b": "fahrt", "th": "คุณไปเที่ยวกับใคร", "v": ["mit wem = กับใคร", "in den Urlaub fahren = ไปเที่ยว"], "ans": "Mit wem fährst du in den Urlaub?"}, {"id": 39, "typ": "Frage", "q": "___ du Geschwister?", "a": "Hast", "b": "Bist", "th": "คุณมีพี่น้องไหม", "v": ["die Geschwister = พี่น้อง", "haben = มี"], "ans": "Hast du Geschwister?"}, {"id": 40, "typ": "Frage", "q": "Welche Musik ___ du gern?", "a": "hörst", "b": "hört", "th": "คุณชอบฟังเพลงแบบไหน", "v": ["Musik hören = ฟังเพลง", "welche = แบบไหน"], "ans": "Welche Musik hörst du gern?"}, {"id": 41, "typ": "Imperativ", "q": "___ Sie bitte die Tür!", "a": "Schließen", "b": "Schließt", "th": "กรุณาปิดประตู", "v": ["schließen = ปิด", "die Tür = ประตู"], "ans": "Schließen Sie bitte die Tür!"}, {"id": 42, "typ": "Imperativ", "q": "___ bitte langsam!", "a": "Sprich", "b": "Sprichst", "th": "กรุณาพูดช้า ๆ", "v": ["sprechen = พูด", "langsam = ช้า"], "ans": "Sprich bitte langsam!"}, {"id": 43, "typ": "Imperativ", "q": "___ Sie hier Ihren Namen!", "a": "Schreiben", "b": "Schreibt", "th": "กรุณาเขียนชื่อของคุณตรงนี้", "v": ["schreiben = เขียน", "der Name = ชื่อ"], "ans": "Schreiben Sie hier Ihren Namen!"}, {"id": 44, "typ": "Imperativ", "q": "___ bitte einen Moment!", "a": "Warte", "b": "Wartest", "th": "กรุณารอสักครู่", "v": ["warten = รอ", "der Moment = ชั่วครู่"], "ans": "Warte bitte einen Moment!"}, {"id": 45, "typ": "Imperativ", "q": "___ Sie geradeaus!", "a": "Gehen", "b": "Geht", "th": "กรุณาเดินตรงไป", "v": ["geradeaus = ตรงไป", "gehen = เดิน"], "ans": "Gehen Sie geradeaus!"}, {"id": 46, "typ": "Imperativ", "q": "___ bitte das Fenster auf!", "a": "Mach", "b": "Machst", "th": "กรุณาเปิดหน้าต่าง", "v": ["aufmachen = เปิด", "das Fenster = หน้าต่าง"], "ans": "Mach bitte das Fenster auf!"}, {"id": 47, "typ": "Imperativ", "q": "___ Sie bitte Platz!", "a": "Nehmen", "b": "Nimmt", "th": "กรุณานั่ง", "v": ["Platz nehmen = นั่ง", "bitte = กรุณา"], "ans": "Nehmen Sie bitte Platz!"}, {"id": 48, "typ": "Imperativ", "q": "___ deine Hausaufgaben!", "a": "Mach", "b": "Machst", "th": "ทำการบ้านของเธอ", "v": ["die Hausaufgaben = การบ้าน", "machen = ทำ"], "ans": "Mach deine Hausaufgaben!"}, {"id": 49, "typ": "Imperativ", "q": "___ Sie bitte links ab!", "a": "Biegen", "b": "Biegt", "th": "กรุณาเลี้ยวซ้าย", "v": ["abbiegen = เลี้ยว", "links = ซ้าย"], "ans": "Biegen Sie bitte links ab!"}, {"id": 50, "typ": "Imperativ", "q": "___ bitte vorsichtig!", "a": "Sei", "b": "Bist", "th": "โปรดระวัง", "v": ["vorsichtig = ระมัดระวัง", "sein = เป็น/อยู่"], "ans": "Sei bitte vorsichtig!"}];let deck=[],cur,shown=false,picked=null,sec=30,left=30,timer=null;const $=x=>document.getElementById(x);function mix(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function fresh(){deck=mix(cards.map(c=>c.id));count()}function count(){$("count").textContent="การ์ดเหลือ "+deck.length+"/50"}function stopVoice(){if(window.speechSynthesis)speechSynthesis.cancel()}function render(){let c=cur;$("tag").textContent="KARTE "+c.id+"/50 · "+c.typ;$("q").textContent=c.q.replace("___","________");$("th").textContent="🇹🇭 "+c.th;$("voc").innerHTML=c.v.map(x=>"<span>"+x+"</span>").join("");let op=mix([c.a,c.b]);$("opts").innerHTML="";op.forEach((x,i)=>{let b=document.createElement("button");b.textContent=(i?"b. ":"a. ")+x;b.className=picked===x?"sel":"";b.onclick=()=>{picked=x;render()};$("opts").appendChild(b)});$("ans").innerHTML="<b>Richtige Antwort:</b> "+c.a+"<br><b>Vollständiger Satz:</b> "+c.ans+"<br><b>🇹🇭 คำแปล:</b> "+c.th;$("ans").className="ans"+(shown?" on":"")}function draw(){if(!deck.length)fresh();cur=cards.find(c=>c.id===deck.pop());shown=false;picked=null;stopVoice();render();count()}function clock(){$("clock").textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0")}function pause(){if(timer){clearInterval(timer);timer=null}}$("next").onclick=draw;$("shuffle").onclick=()=>{fresh();draw()};$("reveal").onclick=()=>{shown=!shown;render()};$("dur").onchange=()=>{pause();sec=+$("dur").value;left=sec;clock()};$("start").onclick=()=>{if(timer){pause();return}if(left<=0)left=sec;timer=setInterval(()=>{left--;clock();if(left<=0)pause()},1000)};$("reset").onclick=()=>{pause();left=sec;clock()};$("voice").onclick=()=>{stopVoice();let u=new SpeechSynthesisUtterance(cur.ans);u.lang="de-DE";u.rate=.82;speechSynthesis.speak(u)};$("stop").onclick=stopVoice;fresh();draw();clock();</script></body></html>
